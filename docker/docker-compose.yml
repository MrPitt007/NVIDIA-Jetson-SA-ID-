version: "3.9"

# SA-ID Enterprise Platform — Docker Compose
# NVIDIA Jetson AGX Orin 64GB | Ubuntu 20.04 LTS
# Deploy: docker compose up -d

services:

  # ── SA-ID Identity Backend ──────────────────────────────────────────────────
  said-identity:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: said-identity
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PORT=8443
      - WORKERS=4
      - DEBUG=false
      - DB_PATH=/opt/said/audit/audit.db
      - LOG_DIR=/var/log/said
      - TLS_CERT_PATH=/opt/said/certs/server.crt
      - TLS_KEY_PATH=/opt/said/certs/server.key
      - TLS_CA_PATH=/opt/said/certs/ca.crt
    env_file:
      - config/.env            # secrets loaded from encrypted env file
    volumes:
      - said-audit:/opt/said/audit          # encrypted audit DB
      - said-certs:/opt/said/certs:ro       # TLS certificates
      - said-models:/opt/said/models:ro     # JAX / TensorRT model weights
      - said-logs:/var/log/said             # structured logs
      - said-config:/opt/said/config:ro     # config + .env
    devices:
      - /dev/nvdla0:/dev/nvdla0             # NVDLA v2.0 accelerator 0
      - /dev/nvdla1:/dev/nvdla1             # NVDLA v2.0 accelerator 1
      - /dev/video0:/dev/video0             # MIPI CSI-2 document camera
      - /dev/video1:/dev/video1             # IR liveness camera
      - /dev/ttyACM0:/dev/ttyACM0           # NFC reader
    ports:
      - "8443:8443"                         # HTTPS API (enterprise clients)
    networks:
      - said-internal
      - said-external
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/v1/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ── SA-ID Payment Service ───────────────────────────────────────────────────
  said-payment:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: said-payment
    command: ["python", "-m", "uvicorn", "payment_worker:app", "--port", "8444"]
    environment:
      - PORT=8444
      - WORKERS=2
      - PCI_HSM_DEVICE=/dev/ttyUSB0
      - HIGH_VALUE_GATE=5000.0
    env_file:
      - config/.env
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0           # EMV PIN-pad HSM
    volumes:
      - said-audit:/opt/said/audit
      - said-certs:/opt/said/certs:ro
      - said-config:/opt/said/config:ro
    ports:
      - "8444:8444"
    networks:
      - said-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Nginx TLS Termination + mTLS ───────────────────────────────────────────
  said-nginx:
    image: nginx:1.25-alpine
    container_name: said-nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - said-certs:/etc/nginx/certs:ro
    ports:
      - "443:443"                           # Public HTTPS
    networks:
      - said-internal
      - said-external
    depends_on:
      - said-identity
      - said-payment
    restart: unless-stopped

  # ── Redis — Rate limit & session state ─────────────────────────────────────
  said-redis:
    image: redis:7-alpine
    container_name: said-redis
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --appendfsync everysec
      --save 60 100
    volumes:
      - said-redis:/data
    networks:
      - said-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


volumes:
  said-audit:   { driver: local }
  said-certs:   { driver: local }
  said-models:  { driver: local }
  said-logs:    { driver: local }
  said-config:  { driver: local }
  said-redis:   { driver: local }


networks:
  said-internal:
    driver: bridge
    internal: true               # no direct external access
  said-external:
    driver: bridge
