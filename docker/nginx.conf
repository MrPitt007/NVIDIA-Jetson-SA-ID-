# SA-ID Nginx — TLS 1.3 only, mTLS client certs, rate limiting
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
}

http {
    # ── Security Globals ───────────────────────────────────────────────────
    server_tokens            off;
    more_clear_headers       Server;
    client_max_body_size     10m;
    client_body_timeout      30s;
    client_header_timeout    30s;
    keepalive_timeout        75s;
    send_timeout             30s;

    # ── Rate Limiting ──────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone  $http_x_sa_id_terminal zone=terminal:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ── TLS Session Cache ──────────────────────────────────────────────────
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format said_json '{"ts":"$time_iso8601","ip":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"body_bytes":$body_bytes_sent,'
        '"req_time":$request_time,"terminal":"$http_x_sa_id_terminal"}';

    access_log /var/log/nginx/said_access.log said_json;
    error_log  /var/log/nginx/said_error.log  warn;

    # ── Upstream ───────────────────────────────────────────────────────────
    upstream said_identity {
        server said-identity:8443;
        keepalive 32;
    }
    upstream said_payment {
        server said-payment:8444;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS Main ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;

        # TLS 1.3 ONLY — PCI-DSS v4.0 requirement
        ssl_protocols             TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers               TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # mTLS — require valid client certificate
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        # OCSP Stapling
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            DENY always;
        add_header X-Content-Type-Options     nosniff always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header Cache-Control             "no-store" always;
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none';" always;

        # Block suspicious methods
        if ($request_method !~ ^(GET|POST|HEAD)$) {
            return 405;
        }

        # ── Identity API ─────────────────────────────────────────────────
        location /api/v1/identity/ {
            limit_req  zone=terminal burst=10 nodelay;
            limit_conn conn 20;

            proxy_pass         https://said_identity;
            proxy_ssl_verify   off;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Client-Cert     $ssl_client_cert;
            proxy_read_timeout 30s;
        }

        # ── Payment API ──────────────────────────────────────────────────
        location /api/v1/payment/ {
            limit_req  zone=api burst=5 nodelay;
            limit_conn conn 10;

            proxy_pass         https://said_payment;
            proxy_ssl_verify   off;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # ── Auth ─────────────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req  zone=api burst=5 nodelay;
            proxy_pass https://said_identity/api/v1/auth/;
            proxy_ssl_verify off;
        }

        # ── Health (no auth required, no rate limit) ──────────────────
        location /api/v1/health/ping {
            proxy_pass       https://said_identity/api/v1/health/ping;
            proxy_ssl_verify off;
            access_log       off;
        }

        # ── Block everything else ─────────────────────────────────────
        location / {
            return 404;
        }
    }
}
